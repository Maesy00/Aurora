<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ironly</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="images/icon-512.png">
  <link rel="apple-touch-icon" href="images/icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ironly">
  <meta name="theme-color" content="#0033FF">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="auth-gate">
    <div class="auth-card">
      <div class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f6f3ec" stroke-width="2.3">
          <rect x="2.5" y="9" width="3" height="6"/><rect x="18.5" y="9" width="3" height="6"/>
          <path d="M5.5 12h13"/><rect x="7" y="7.5" width="2.5" height="9"/><rect x="14.5" y="7.5" width="2.5" height="9"/>
        </svg>
      </div>
      <h1 id="auth-title">Connexion</h1>
      <p class="auth-subtitle">Tes séances, synchronisées sur tous tes appareils.</p>

      <form id="auth-form">
        <label class="field">
          <span>Email</span>
          <input type="email" id="auth-email" required autocomplete="email">
        </label>
        <label class="field">
          <span>Mot de passe</span>
          <input type="password" id="auth-password" required autocomplete="current-password" minlength="6">
        </label>
        <p id="auth-error" class="auth-error" hidden></p>
        <p id="auth-info" class="auth-info" hidden></p>
        <button type="submit" class="btn btn-primary btn-block" id="auth-submit-btn">Se connecter</button>
      </form>

      <p class="auth-switch">
        <span id="auth-switch-text">Pas encore de compte ?</span>
        <button type="button" id="auth-toggle-mode">Créer un compte</button>
      </p>
    </div>
  </div>

  <div class="app-shell" id="app-shell" hidden>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f6f3ec" stroke-width="2.3">
            <rect x="2.5" y="9" width="3" height="6"/><rect x="18.5" y="9" width="3" height="6"/>
            <path d="M5.5 12h13"/><rect x="7" y="7.5" width="2.5" height="9"/><rect x="14.5" y="7.5" width="2.5" height="9"/>
          </svg>
        </div>
        <span class="brand-word">Ironly</span>
        <span class="brand-rule" aria-hidden="true"></span>
        <span class="tagline">Renfo · Triathlon</span>
        <button type="button" id="sign-out-btn" class="sign-out-btn" aria-label="Se déconnecter">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </header>

    <main id="view-container">
      <!-- ================= SÉANCE ================= -->
      <section id="view-session" class="view">
        <div id="session-idle" class="panel-stack">
          <button id="btn-start-blank" class="btn btn-primary btn-block">+ Séance libre</button>
          <h2 class="section-title">Démarrer depuis un plan</h2>
          <div id="quick-start-plans" class="card-list"></div>
          <button id="btn-open-plans-manager" class="btn-tertiary">Gérer mes plans</button>
        </div>

        <div id="session-active" class="hidden">
          <div class="session-header">
            <input type="date" id="session-date" class="session-date-plain" aria-label="Date de la séance">
            <span id="session-plan-badge" class="badge hidden"></span>
          </div>

          <div id="session-exercises" class="card-list"></div>

          <button id="btn-add-exercise" class="btn btn-secondary btn-block">+ Ajouter un exercice</button>

          <div class="session-actions">
            <button id="btn-cancel-session" class="btn btn-ghost">Annuler</button>
            <button id="btn-finish-session" class="btn btn-primary">Terminer la séance</button>
          </div>
        </div>

        <div id="plans-manager" class="hidden">
          <div id="plans-list-panel" class="panel-stack">
            <button id="btn-back-to-session" class="btn-tertiary">← Retour à la séance</button>
            <button id="btn-new-plan" class="btn btn-primary btn-block">+ Nouveau plan</button>
            <div id="plans-list" class="card-list"></div>
          </div>

          <div id="plan-editor" class="hidden">
            <div class="card">
              <label class="field">
                <span>Nom du plan</span>
                <input type="text" id="plan-name" placeholder="Ex. Force jambes — bloc 1">
              </label>
            </div>

            <div id="plan-exercises" class="card-list"></div>

            <button id="btn-plan-add-exercise" class="btn btn-secondary btn-block">+ Ajouter un exercice</button>

            <div class="session-actions">
              <button id="btn-cancel-plan" class="btn btn-ghost">Annuler</button>
              <button id="btn-save-plan" class="btn btn-primary">Enregistrer le plan</button>
            </div>
          </div>
        </div>
      </section>

      <!-- ================= HISTORIQUE ================= -->
      <section id="view-history" class="view hidden">
        <div id="history-list" class="card-list"></div>
        <p id="history-empty" class="empty-hint hidden">Aucune séance enregistrée pour l'instant.</p>
      </section>

      <!-- ================= STATS ================= -->
      <section id="view-stats" class="view hidden">
        <div class="card">
          <div class="calendar-header">
            <button type="button" id="calendar-prev" class="calendar-nav-btn" aria-label="Mois précédent">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <h2 class="section-title" id="calendar-month-label">Régularité</h2>
            <button type="button" id="calendar-next" class="calendar-nav-btn" aria-label="Mois suivant">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>
            </button>
          </div>
          <div class="calendar-weekdays">
            <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
          </div>
          <div id="calendar-grid" class="calendar-grid"></div>
        </div>

        <div class="card">
          <h2 class="section-title">Progression par exercice</h2>
          <label class="field">
            <span>Exercice</span>
            <select id="stats-exercise-select"></select>
          </label>
          <div id="stats-exercise-empty" class="empty-hint hidden">Pas encore de données pour cet exercice.</div>
          <div id="stats-exercise-charts" class="hidden">
            <div class="metric-toggle">
              <button type="button" class="metric-toggle-btn active" data-metric="top">Charge</button>
              <button type="button" class="metric-toggle-btn" data-metric="volume">Volume</button>
            </div>
            <div id="stats-progress-chart"></div>
          </div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-view="session">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="9" width="3" height="6" rx="1"/><rect x="18.5" y="9" width="3" height="6" rx="1"/><path d="M5.5 12h13"/><rect x="7" y="7.5" width="2.5" height="9" rx="1"/><rect x="14.5" y="7.5" width="2.5" height="9" rx="1"/></svg>
        <span>Séance</span>
      </button>
      <button class="nav-btn" data-view="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        <span>Historique</span>
      </button>
      <button class="nav-btn" data-view="stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M11 20V4M18 20v-7"/></svg>
        <span>Stats</span>
      </button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/exercises.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
